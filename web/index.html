<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影库</title>
    <link rel="stylesheet" href="css/library.css">
</head>
<body>
    <div class="lib-top">
        <div class="lib-brand">影<span>库</span></div>
        <div class="lib-search-wrap">
            <span class="lib-search-icon">⌕</span>
            <input id="libSearch" class="lib-search" type="search" placeholder="搜索番号 / 标题 / 演员">
        </div>
        <div id="libCount" class="lib-count"></div>
    </div>
    <div class="lib-layout">
        <aside class="lib-side">
            <div id="libChips" class="lib-chips"></div>
        </aside>
        <main class="lib-main">
            <div id="libGrid" class="lib-grid"></div>
            <div id="libMore" class="lib-more"></div>
        </main>
    </div>
    <script src="js/library.js"></script>
</body>
</html>
