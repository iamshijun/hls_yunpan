<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影库</title>
    <link rel="stylesheet" href="css/library.css">
</head>
<body>
    <div class="lib-top">
        <div class="lib-brand">影<span>库</span></div>
        <div class="lib-search-wrap">
            <span class="lib-search-icon">⌕</span>
            <input id="libSearch" class="lib-search" type="search" placeholder="搜索番号 / 标题 / 演员">
        </div>
        <div id="libCount" class="lib-count"></div>
        <div class="view-toggle" id="viewToggle">
            <button id="btnList" title="列表模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <button id="btnCard" title="卡片模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
        </div>
    </div>
    <div class="lib-layout">
        <aside class="lib-side">
            <div id="libChips" class="lib-chips"></div>
        </aside>
        <main class="lib-main">
            <div id="libGrid" class="lib-grid"></div>
            <div id="libMore" class="lib-more"></div>
        </main>
    </div>
    <script src="js/library.js"></script>
</body>
</html>
