<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放</title>
    <link rel="stylesheet" href="css/play.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div class="play-container">
        <div class="play-top">
            <a class="back-link" href="/web/">← 返回影库</a>
            <span class="crumb">/hls/<code id="crumbPath">…</code>/playlist.m3u8</span>
        </div>

        <section class="play-hero" id="hero">
            <div class="play-hero-bg" id="heroBg" hidden></div>
            <div class="play-hero-poster" id="heroPoster"></div>
            <div class="play-hero-body">
                <h1 id="title">播放中…</h1>
                <div class="play-hero-meta" id="heroMeta"></div>
                <div class="play-hero-sub" id="heroSub"></div>
            </div>
        </section>

        <section class="play-cast" id="castSection" hidden>
            <h3>演员</h3>
            <div class="play-cast-chips" id="castChips"></div>
        </section>

        <section class="play-player">
            <video id="video" controls></video>
            <div class="play-player-info">
                <span id="currentPath">当前播放: </span>
                <span class="play-status idle" id="status">准备就绪</span>
            </div>
            <div class="play-error" id="errorMessage"></div>
        </section>

        <section class="play-fields" id="fields"></section>
    </div>

    <script src="js/play.js"></script>
</body>
</html>
